  <rect x="4" y="12" width="14" height="4" rx="2" fill="#fbbf24"/>
  <rect x="4" y="18" width="19" height="4" rx="2" fill="#f472b6"/>
  <rect x="4" y="24" width="11" height="4" rx="2" fill="#34d399"/>

  <!-- Today line — red vertical marker -->
